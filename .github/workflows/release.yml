name: Automated Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Windows Desktop (win-x64 - Single File R2R)
        run: dotnet publish -c Release -f net10.0-windows7.0 -r win-x64 --self-contained -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false VRCScalerOSC_Windows/VRCScalerOSC_Windows.csproj -o ./publish/windows-desktop

      - name: Publish Windows Console (win-x64 - Single File R2R with Trimming)
        run: dotnet publish -c Release -f net10.0 -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -p:DebugSymbols=false VRCScalerOSC_Console/VRCScalerOSC_Console.csproj -o ./publish/win-x64

      - name: Create packages directory
        run: mkdir packages

      - name: Install WiX Toolset and Build MSI with EULA
        shell: pwsh
        run: |
          # 1. Install WiX Toolset core tools
          dotnet tool install --global wix

          # 2. Add required extensions with EULA acceptance flag
          wix extension add WixToolset.UI.wixext -acceptEula wix7
          wix extension add WixToolset.Util.wixext -acceptEula wix7

          # 3. VERIFY: Ensure the user's uploaded WordPad RTF file exists
          $licensePath = "Docs/EULA for msi.rtf"
          if (-not (Test-Path $licensePath)) {
            Write-Error "CRITICAL ERROR: $licensePath was not found in your repository!"
            exit 1
          }

          # 4. Dynamically generate WiX source code (product.wxs) linked to your custom .ico file
          $wxsContent = @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs" xmlns:ui="http://wixtoolset.org/schemas/v4/wxs/ui">
            <Package Name="VRCScalerOSC" Manufacturer="VRCScalerOSC Team" Version="1.0.0" UpgradeCode="db7bc624-9b8e-4a6c-9a1d-2394fd5e2a22" Language="1028" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of VRCScalerOSC is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <!-- Link global application icon directly to your source .ico file -->
              <Icon Id="AppIcon" SourceFile="VRCScalerOSC.ico" />
              <Property Id="ARPPRODUCTICON" Value="AppIcon" />

              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="VRCScalerOSC" />
              </StandardDirectory>

              <StandardDirectory Id="DesktopFolder" />
              <StandardDirectory Id="ProgramMenuFolder" />

              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <!-- Main Executable File -->
                <Component Id="MainExecutable" Guid="a5b5c5d5-e5f5-4a5b-bcde-1234567890ab">
                  <File Id="VRCScalerOSC_EXE" Source="publish\windows-desktop\VRCScalerOSC_Windows.exe" KeyPath="yes" />
                </Component>

                <!-- Shortcuts Component binding with your local custom Icon asset -->
                <Component Id="ApplicationShortcuts" Guid="b6c6d6e6-f6a6-4b6c-bcde-8765432109ba">
                  <Shortcut Id="DesktopShortcut" Directory="DesktopFolder" Name="VRCScalerOSC" Target="[INSTALLFOLDER]VRCScalerOSC_Windows.exe" WorkingDirectory="INSTALLFOLDER" Icon="AppIcon" />
                  <Shortcut Id="StartMenuShortcut" Directory="ProgramMenuFolder" Name="VRCScalerOSC" Target="[INSTALLFOLDER]VRCScalerOSC_Windows.exe" WorkingDirectory="INSTALLFOLDER" Icon="AppIcon" />
                  <RegistryValue Root="HKCU" Key="Software\VRCScalerOSCTeam\VRCScalerOSC" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </ComponentGroup>

              <Feature Id="ProductFeature" Title="VRCScalerOSC" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
              </Feature>

              <WixVariable Id="WixUILicenseRtf" Value="Docs\EULA for msi.rtf" />
              <ui:WixUI Id="WixUI_Minimal" />
            </Package>
          </Wix>
          "@
          Set-Content -Path "product.wxs" -Value $wxsContent

          # 5. Compile and link into the final msi package
          wix build product.wxs -ext WixToolset.UI.wixext -acceptEula wix7 -o "packages/VRCScalerOSC-windows-desktop-x64.msi"
          Write-Host "MSI Installer with custom EULA and custom ICO file created successfully"

      - name: Package Windows Desktop (Keep Zip & Extract EXE)
        shell: pwsh
        run: |
          $desktopPath = "publish/windows-desktop"
          if (Test-Path $desktopPath) {
            Copy-Item "$desktopPath/VRCScalerOSC_Windows.exe" -Destination "packages/VRCScalerOSC-windows-desktop-x64.exe" -Force
            Compress-Archive -Path "$desktopPath/*" -DestinationPath "packages/VRCScalerOSC-windows-desktop-x64.zip" -Force
          } else {
            Write-Error "Desktop path not found: $desktopPath"
            exit 1
          }

      - name: Package Windows Console (Keep Zip & Extract EXE)
        shell: pwsh
        run: |
          $consolePath = "publish/win-x64"
          if (Test-Path $consolePath) {
            Copy-Item "$consolePath/VRCScalerOSC_Console.exe" -Destination "packages/VRCScalerOSC-windows-console-x64.exe" -Force
            Compress-Archive -Path "$consolePath/*" -DestinationPath "packages/VRCScalerOSC-windows-console-x64.zip" -Force
          } else {
            Write-Error "Console path not found: $consolePath"
            exit 1
          }

      - name: Verify packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem packages/
          Write-Host "Created packages and installers:"
          $packages | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }
          if ($packages.Count -eq 0) {
            Write-Error "No packages were created!"
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: packages/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Core library
        run: dotnet restore VRCScalerOSC/VRCScalerOSC.csproj

      - name: Restore Console
        run: dotnet restore VRCScalerOSC_Console/VRCScalerOSC_Console.csproj

      - name: Publish Linux Console (linux-x64 - Single File R2R with Trimming)
        run: dotnet publish -c Release -f net10.0 -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -p:DebugSymbols=false VRCScalerOSC_Console/VRCScalerOSC_Console.csproj -o ./publish/linux-x64

      - name: Create packages directory
        run: mkdir -p packages

      - name: Package Linux Console (Keep Tar.gz & Extract Executable)
        run: |
          if [ -d "publish/linux-x64" ]; then
            cp publish/linux-x64/VRCScalerOSC_Console packages/VRCScalerOSC-linux-console-x64
            chmod +x packages/VRCScalerOSC-linux-console-x64
            cd publish/linux-x64
            tar -czf ../../packages/VRCScalerOSC-linux-console-x64.tar.gz *
            cd ../../
          else
            echo "Error: publish/linux-x64 directory not found"
            exit 1
          fi

      - name: Verify packages
        run: |
          echo "Created packages and executables:"
          ls -lh packages/
          if [ ! -f "packages/VRCScalerOSC-linux-console-x64.tar.gz" ]; then
            echo "Error: Linux package not created!"
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: packages/

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-packages

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-packages

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: VRCScalerOSC ${{ steps.get_version.outputs.VERSION }}
          files: |
            release-packages/VRCScalerOSC-windows-desktop-x64.msi
            release-packages/VRCScalerOSC-windows-desktop-x64.zip
            release-packages/VRCScalerOSC-windows-desktop-x64.exe
            release-packages/VRCScalerOSC-windows-console-x64.zip
            release-packages/VRCScalerOSC-windows-console-x64.exe
            release-packages/VRCScalerOSC-linux-console-x64.tar.gz
            release-packages/VRCScalerOSC-linux-console-x64
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## New Release Available

            ### Windows Installer
            * **Windows Desktop Installer**: `VRCScalerOSC-windows-desktop-x64.msi` (Includes installation setup wizard and desktop shortcut with EULA)

            ### Application Packages (Including Dependencies)
            * **Windows Desktop App**: `VRCScalerOSC-windows-desktop-x64.zip`
            * **Windows Console App**: `VRCScalerOSC-windows-console-x64.zip`
            * **Linux Console App**: `VRCScalerOSC-linux-console-x64.tar.gz`

            ### Single Standalone Executables
            * **Windows Desktop Executable**: `VRCScalerOSC-windows-desktop-x64.exe`
            * **Windows Console Executable**: `VRCScalerOSC-windows-console-x64.exe`
            * **Linux Console Executable**: `VRCScalerOSC-linux-console-x64`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
